<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки — API Integration Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-6">
<div class="max-w-[1000px] mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-2xl">⚙️</span>
            <div>
                <h1 class="text-xl font-bold text-slate-950">Системные настройки</h1>
                <p class="text-xs text-slate-500">Конфигурация идентификаторов и API</p>
            </div>
        </div>
        <a href="/" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg border text-sm">⬅️ На главную</a>
    </header>

    <div class="p-6 space-y-6">
        <div id="statusAlert" class="hidden px-4 py-3 rounded-lg border text-sm font-semibold"></div>

        <form id="settingsForm" class="space-y-6">
            <section class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase border-b pb-2">🌐 API и Идентификация</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">Системный Tenant ID</label>
                        <input type="text" id="TENANT_ID" class="bg-white border rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">Системный User ID</label>
                        <input type="text" id="USER_ID" class="bg-white border rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-2">
                        <label class="text-xs font-semibold text-slate-700">BASE_URL</label>
                        <input type="text" id="BASE_URL" class="bg-white border rounded-lg px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>
                </div>
            </section>

            <!-- Прочие настройки (Elastic, DB) добавляются по аналогии -->

            <div class="border-t border-slate-200 pt-4 flex justify-end">
                <button type="button" id="saveSettingsBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-sm text-sm">
                    💾 Сохранить конфигурацию
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const fields = ["TENANT_ID", "USER_ID", "BASE_URL"];

    async function load() {
        const r = await fetch('/config/app-settings');
        const d = await r.json();
        fields.forEach(f => {
            const el = document.getElementById(f);
            if (el && d[f]) el.value = d[f];
        });
    }

    document.getElementById('saveSettingsBtn').onclick = async () => {
        const payload = {};
        fields.forEach(f => payload[f] = document.getElementById(f).value);
        const r = await fetch('/config/app-settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if (r.ok) {
            document.getElementById('statusAlert').textContent = "Сохранено! Сервер перезапустится для применения изменений.";
            document.getElementById('statusAlert').className = "px-4 py-3 rounded-lg border text-sm font-semibold block bg-emerald-50 text-emerald-700 border-emerald-200";
        }
    };

    window.onload = load;
</script>
</body>
</html>
