<!-- templates/settings.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки приложения — API Integration Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-6 selection:bg-indigo-500 selection:text-white">
<div class="max-w-[1000px] mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <span class="text-2xl">⚙️</span>
            <div>
                <h1 class="text-xl font-bold text-slate-950">Системные настройки</h1>
                <p class="text-xs text-slate-500">Конфигурация бэкенда, БД и Elasticsearch (.env)</p>
            </div>
        </div>
        <div class="flex gap-2">
            <a href="/database" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm flex items-center gap-1.5">
                <span>🗄️</span> Управление БД
            </a>
            <a href="/" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg border border-slate-300 shadow-sm text-sm flex items-center gap-1.5">
                <span>⬅️</span> Вернуться на главную
            </a>
        </div>
    </header>

    <div class="p-6 space-y-6">
        <div id="statusAlert" class="hidden px-4 py-3 rounded-lg border text-sm font-semibold"></div>

        <form id="settingsForm" class="space-y-6">
            <!-- Tenant / User -->
            <section class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-2">👤 Tenant / User</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">TENANT_ID</label>
                        <input type="text" id="TENANT_ID" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">USER_ID</label>
                        <input type="text" id="USER_ID" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                </div>
            </section>

            <!-- Внешний API -->
            <section class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-2">🌐 Внешний API</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">BASE_URL</label>
                        <input type="text" id="BASE_URL" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">REQUEST_TIMEOUT (сек)</label>
                        <input type="number" id="REQUEST_TIMEOUT" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                </div>
            </section>

            <!-- Elasticsearch -->
            <section class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-2">🔍 Elasticsearch</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">ES_HOST</label>
                        <input type="text" id="ES_HOST" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">INDEX_NAME</label>
                        <input type="text" id="INDEX_NAME" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">SCROLL_SIZE</label>
                        <input type="number" id="SCROLL_SIZE" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">REQUEST_TIMEOUT_ES (сек)</label>
                        <input type="number" id="REQUEST_TIMEOUT_ES" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">OUTPUT_JSONL</label>
                        <input type="text" id="OUTPUT_JSONL" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">OUTPUT_CSV</label>
                        <input type="text" id="OUTPUT_CSV" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                </div>
            </section>

            <!-- PostgreSQL -->
            <section class="space-y-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100 pb-2">🐘 PostgreSQL Database</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">DB_HOST</label>
                        <input type="text" id="DB_HOST" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">DB_PORT</label>
                        <input type="number" id="DB_PORT" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">DB_NAME</label>
                        <input type="text" id="DB_NAME" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-slate-700">DB_USER</label>
                        <input type="text" id="DB_USER" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-2">
                        <label class="text-xs font-semibold text-slate-700">DB_PASSWORD</label>
                        <input type="password" id="DB_PASSWORD" class="bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 font-medium focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
                    </div>
                </div>
            </section>

            <div class="border-t border-slate-200 pt-4 flex justify-end">
                <button type="button" id="saveSettingsBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-lg shadow-sm transition-all duration-150 text-sm">
                    💾 Сохранить конфигурацию
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const statusAlert = document.getElementById('statusAlert');
    const fields = [
        "TENANT_ID", "USER_ID", "BASE_URL", "REQUEST_TIMEOUT", "ES_HOST", "INDEX_NAME",
        "SCROLL_SIZE", "REQUEST_TIMEOUT_ES", "OUTPUT_JSONL",
        "OUTPUT_CSV", "DB_HOST", "DB_PORT", "DB_NAME", "DB_USER", "DB_PASSWORD"
    ];

    function showAlert(text, isError) {
        if (isError === undefined) isError = false;
        statusAlert.textContent = text;
        statusAlert.className = "px-4 py-3 rounded-lg border text-sm font-semibold block " +
            (isError ? "bg-red-50 text-red-700 border-red-200" : "bg-emerald-50 text-emerald-700 border-emerald-200");
        setTimeout(function() { statusAlert.className = 'hidden'; }, 6000);
    }

    async function loadAppSettings() {
        try {
            const res = await fetch('/config/app-settings');
            if (!res.ok) throw new Error('Не удалось загрузить настройки');
            const data = await res.json();
            fields.forEach(f => {
                const input = document.getElementById(f);
                if (input && data[f] !== undefined) {
                    input.value = data[f];
                }
            });
        } catch (err) {
            showAlert('Ошибка при загрузке настроек: ' + err.message, true);
        }
    }

    async function saveAppSettings() {
        saveSettingsBtn.disabled = true;
        saveSettingsBtn.textContent = 'Сохранение...';

        const payload = {};
        fields.forEach(f => {
            const input = document.getElementById(f);
            if (input) {
                payload[f] = input.value;
            }
        });

        try {
            const res = await fetch('/config/app-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                showAlert('Настройки успешно обновлены! Перезапуск сервера uvicorn произойдет автоматически.', false);
            } else {
                showAlert('Ошибка сохранения: ' + (data.detail || 'Неизвестная ошибка'), true);
            }
        } catch (err) {
            showAlert('Сетевая ошибка при сохранении: ' + err.message, true);
        } finally {
            saveSettingsBtn.disabled = false;
            saveSettingsBtn.textContent = '💾 Сохранить конфигурацию';
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadAppSettings();
        saveSettingsBtn.onclick = saveAppSettings;
    });
</script>
</body>
</html>
