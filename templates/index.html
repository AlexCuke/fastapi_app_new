<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Integration Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-6 selection:bg-indigo-500 selection:text-white">
<div class="max-w-[1800px] mx-auto bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex flex-row justify-between items-center">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🚀</span>
            <div>
                <h1 class="text-xl font-bold text-slate-950">API Integration Service</h1>
                <p class="text-[10px] text-slate-500 font-mono">
                    ID: <span id="displayTenant" class="text-indigo-600 font-bold">...</span> | 
                    User: <span id="displayUser" class="text-indigo-600 font-bold">...</span>
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="/settings" class="bg-white hover:bg-slate-50 text-slate-600 font-semibold py-2 px-4 rounded-lg border border-slate-300 shadow-sm text-sm">⚙️ Настройки</a>
            <a href="/services" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm text-sm">🛠️ Сервис</a>
        </div>
    </header>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6 p-6">
        <!-- LEFT: COMMANDS -->
        <aside class="xl:col-span-3 flex flex-col gap-5 bg-slate-50 border border-slate-200 rounded-xl p-5">
            <h3 class="text-lg font-bold text-slate-900 border-b pb-2 mb-3">📋 Команды <span id="cmdCount" class="text-xs opacity-50"></span></h3>
            <div class="space-y-1.5 max-h-[65vh] overflow-y-auto pr-1" id="commandsList"></div>
        </aside>

        <!-- CENTER: EDITOR -->
        <main class="xl:col-span-5 flex flex-col gap-6">
            <section class="bg-teal-50 border border-teal-200 rounded-xl p-5 shadow-sm">
                <h4 class="text-xs font-bold text-teal-800 uppercase mb-3">🔍 Быстрый поиск (GET)</h4>
                <div class="flex gap-3">
                    <input type="text" id="compositionUidInput" placeholder="Composition UID" class="flex-grow border rounded-lg px-3 py-2 text-sm focus:ring-1 focus:ring-teal-500 outline-none">
                    <button id="sendGetByUidBtn" class="bg-teal-700 text-white font-semibold py-2 px-5 rounded-lg text-sm">Найти</button>
                </div>
                <div class="mt-3 flex items-center gap-2">
                    <input type="checkbox" id="autoUpdateConfigCheckbox" class="w-3.5 h-3.5 cursor-pointer accent-teal-600">
                    <label for="autoUpdateConfigCheckbox" class="text-[11px] text-teal-900 font-medium cursor-pointer select-none">Обновить параметры БД из ответа</label>
                </div>
            </section>

            <section class="bg-white border border-slate-200 rounded-xl p-5 flex flex-col gap-3 shadow-sm">
                <textarea id="payloadEditor" class="w-full h-80 bg-slate-50 border rounded-lg p-3 font-mono text-xs focus:ring-1 focus:ring-indigo-500 outline-none resize-y"></textarea>
                <div class="flex flex-wrap gap-2.5">
                    <button id="sendBtn" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow-sm"><span>📤</span> HTTP</button>
                    <button id="sendKafkaBtn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow-sm"><span>📡</span> Kafka</button>
                    <button id="reloadConfigBtn" class="bg-white border py-2 px-4 rounded-lg text-sm shadow-sm">Resolve БД</button>
                </div>
            </section>

            <section class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                <h4 class="text-sm font-bold text-slate-700 mb-4">⚡ Актуальные параметры</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-60 overflow-y-auto pr-1" id="quickFormFields"></div>
            </section>
        </main>

        <!-- RIGHT: CONSOLE -->
        <section class="xl:col-span-4 flex flex-col gap-5 bg-white border border-slate-200 rounded-xl p-5 shadow-sm h-[82vh]">
            <h3 class="text-lg font-bold text-slate-900 border-b pb-2">📡 Трассировка</h3>
            <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-lg border">
                <input type="checkbox" id="autoExportCheckbox" class="w-4 h-4 cursor-pointer">
                <label for="autoExportCheckbox" class="text-xs font-semibold text-slate-700 cursor-pointer">Авто-выгрузка индекса</label>
            </div>
            <div id="statusBadge" class="h-6"></div>
            <div class="flex flex-col gap-4 flex-grow overflow-hidden">
                <div class="flex flex-col h-1/3 bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                    <div class="bg-slate-100 px-3 py-1 text-[10px] font-bold uppercase">📤 Request</div>
                    <pre id="sentRequestContent" class="p-3 text-[10px] font-mono whitespace-pre-wrap overflow-auto">—</pre>
                </div>
                <div class="flex flex-col h-2/3 bg-slate-50 rounded-lg border border-slate-200 overflow-hidden">
                    <div class="bg-slate-100 px-3 py-1 text-[10px] font-bold uppercase border-b">📥 Response</div>
                    <pre id="responseContent" class="p-3 text-[11px] font-mono whitespace-pre-wrap overflow-auto">—</pre>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    let appTenantId = "1", appUserId = "1", currentCommandName = "", currentTemplate = null;

    const quickFields = [
        { key: "assignmentCompositionUid", label: "UID назначения" },
        { key: "code", label: "Код процедуры" },
        { key: "doctorName", label: "ФИО врача" },
        { key: "ehrId", label: "ID ЭМК" },
        { key: "patientId", label: "ID пациента" },
        { key: "careCaseId", label: "ID случая" },
        { key: "assignmentId", label: "ID назначения" },
        { key: "resultCompositionUid", label: "UID результата" }
    ];

    async function loadIdentity() {
        try {
            const r = await fetch('/config/app-settings');
            const d = await r.json();
            appTenantId = d.TENANT_ID; appUserId = d.USER_ID;
            document.getElementById('displayTenant').textContent = appTenantId;
            document.getElementById('displayUser').textContent = appUserId;
        } catch(e) { console.error("Identity error", e); }
    }

    function buildForm() {
        const container = document.getElementById('quickFormFields');
        container.innerHTML = '';
        quickFields.forEach(f => {
            const div = document.createElement('div');
            div.id = `cont_${f.key}`;
            div.className = "hidden flex flex-col gap-1";
            div.innerHTML = `<label class="text-[10px] font-bold text-slate-400 uppercase">${f.label}</label><input id="field_${f.key}" class="border rounded px-2 py-1.5 text-xs outline-none focus:ring-1 focus:ring-indigo-500">`;
            container.appendChild(div);
        });
    }

    function updateFormVisibility(template) {
        const str = JSON.stringify(template);
        quickFields.forEach(f => {
            const el = document.getElementById(`cont_${f.key}`);
            if (str.includes(`@config:${f.key}`)) el.classList.remove('hidden');
            else el.classList.add('hidden');
        });
    }

    function showStatus(text, isError = false) {
        document.getElementById('statusBadge').innerHTML = `<span class="px-3 py-1 rounded-full text-[10px] font-bold ${isError ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-700'}">${text}</span>`;
    }

    async function loadCommands() {
        const r = await fetch('/commands');
        const d = await r.json();
        const list = document.getElementById('commandsList');
        list.innerHTML = '';
        d.commands.forEach((cmd, i) => {
            const div = document.createElement('div');
            div.className = "p-3 my-1 bg-white border rounded-lg cursor-pointer text-xs hover:border-indigo-300 shadow-sm transition-all";
            div.innerHTML = `<span class="font-mono text-slate-400 mr-2">${(i+1).toString().padStart(2,'0')}</span> ${cmd}`;
            div.onclick = async () => {
                currentCommandName = cmd;
                const tr = await fetch(`/template/${encodeURIComponent(cmd)}`);
                const td = await tr.json();
                currentTemplate = td.template;
                document.getElementById('payloadEditor').value = JSON.stringify(currentTemplate, null, 2);
                updateFormVisibility(currentTemplate);
                document.querySelectorAll('#commandsList div').forEach(el => el.classList.remove('bg-indigo-50', 'border-indigo-300'));
                div.classList.add('bg-indigo-50', 'border-indigo-300');
            };
            list.appendChild(div);
        });
    }

    async function handleRequest(url) {
        if (!currentCommandName) return alert('Выберите команду');
        try {
            const payload = JSON.parse(document.getElementById('payloadEditor').value);
            const body = { command_name: currentCommandName, tenant_id: appTenantId, user_id: appUserId, override_payload: payload };
            showStatus('Отправка...');
            const r = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
            const d = await r.json();
            document.getElementById('sentRequestContent').textContent = JSON.stringify(d.request_payload, null, 2);
            document.getElementById('responseContent').textContent = `STATUS: ${r.status}\n` + JSON.stringify(d.response || d, null, 2);
            showStatus(r.ok ? 'Успешно' : 'Ошибка', !r.ok);
        } catch(e) { alert('Ошибка JSON'); }
    }

    window.onload = async () => {
        await loadIdentity(); buildForm(); await loadCommands();

        document.getElementById('sendBtn').onclick = () => handleRequest('/execute');
        document.getElementById('reloadConfigBtn').onclick = async () => {
            const r = await fetch('/resolve', { method: 'POST', headers: {'Content-Type':'application/json'}, body: document.getElementById('payloadEditor').value });
            const d = await r.json();
            document.getElementById('payloadEditor').value = JSON.stringify(d.resolved, null, 2);
        };

        document.getElementById('sendGetByUidBtn').onclick = async () => {
            const uid = document.getElementById('compositionUidInput').value.trim();
            if (!uid) return;
            const body = { command_name: "Найти назначение по CompositionUid (GET)", tenant_id: appTenantId, user_id: appUserId, override_payload: { compositionUid: uid } };
            showStatus('Поиск...');
            const r = await fetch('/execute', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
            const d = await r.json();
            document.getElementById('responseContent').textContent = `STATUS: ${r.status}\n` + JSON.stringify(d.response, null, 2);
            if (r.ok) {
                showStatus('Найдено');
                if (document.getElementById('autoUpdateConfigCheckbox').checked && d.response) {
                    await fetch('/config/auto-update', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(d.response) });
                    showStatus('Найдено + БД обновлена');
                }
            } else showStatus('Не найдено', true);
        };
    };
</script>
</body>
</html>
