<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Настройки</title><link rel="stylesheet" href="/css/style.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></head>
<body>
<div class="app-container"><aside class="sidebar"><div class="logo"><i class="fas fa-microchip"></i><span>API Integrator</span></div><nav class="nav-menu"><a href="/index.html" class="nav-item"><i class="fas fa-terminal"></i> Команды</a><a href="/commands.html" class="nav-item"><i class="fas fa-database"></i> Шаблоны</a><a href="/settings.html" class="nav-item active"><i class="fas fa-sliders-h"></i> Настройки</a><a href="/services.html" class="nav-item"><i class="fas fa-cloud-upload-alt"></i> Сервисы</a><a href="/index_db.html" class="nav-item"><i class="fas fa-table"></i> Данные</a><a href="/current_patient.html" class="nav-item"><i class="fas fa-user-md"></i> Текущий пациент</a><a href="/help.html" class="nav-item"><i class="fas fa-question-circle"></i> Помощь</a></nav></aside>
<main class="main-content"><header class="top-bar"><h1><i class="fas fa-sliders-h"></i> Настройки</h1><div class="status-badge">⚙️ Системные</div></header>
<div class="content-grid"><div class="card"><div class="card-header"><i class="fas fa-database"></i> Таблица config</div><div class="card-body"><div id="configList"></div></div></div><div class="card"><div class="card-header"><i class="fas fa-server"></i> Системные настройки (app-settings)</div><div class="card-body"><div id="appSettingsForm"></div><button id="saveAppSettingsBtn" class="btn btn-primary mt-2"><i class="fas fa-save"></i> Сохранить все настройки</button></div></div><div class="card"><div class="card-header"><i class="fas fa-sort"></i> Заголовки сортировки (sort_headers)</div><div class="card-body"><div id="sortHeadersList"></div></div></div></div></main></div>
<script src="/js/common.js"></script>
<script>
    async function loadConfigItems(){ const items = await apiGet('/config/items'); document.getElementById('configList').innerHTML = `<table class="data-table"><thead><tr><th>Ключ</th><th>Значение</th><th>Группа</th><th>Действие</th></tr></thead><tbody>${items.map(i=>`<tr><td>${escapeHtml(i.key)}</td><td><input type="text" id="cfg_${i.key}" value="${escapeHtml(i.value)}" class="form-control-sm"></td><td>${escapeHtml(i.group_name)}</td><td><button class="btn-icon save-cfg" data-key="${i.key}"><i class="fas fa-check"></i></button></td></tr>`).join('')}</tbody></table>`; document.querySelectorAll('.save-cfg').forEach(btn => btn.addEventListener('click', async (e)=>{ const key=btn.dataset.key; const val=document.getElementById(`cfg_${key}`).value; await apiPut(`/config/${key}`, {value: val}); loadConfigItems(); })); }
    async function loadAppSettings(){ const sets = await apiGet('/config/app-settings'); const formHtml = `<div class="form-group"><label>BASE_URL</label><input type="text" id="app_BASE_URL" value="${escapeHtml(sets.BASE_URL)}" class="form-control"></div><div class="form-group"><label>TENANT_ID</label><input id="app_TENANT_ID" value="${escapeHtml(sets.TENANT_ID)}" class="form-control"></div><div class="form-group"><label>USER_ID</label><input id="app_USER_ID" value="${escapeHtml(sets.USER_ID)}" class="form-control"></div><div class="form-group"><label>REQUEST_TIMEOUT</label><input id="app_REQUEST_TIMEOUT" value="${sets.REQUEST_TIMEOUT}" class="form-control"></div><div class="form-group"><label>ES_HOST</label><input id="app_ES_HOST" value="${escapeHtml(sets.ES_HOST)}" class="form-control"></div>`; document.getElementById('appSettingsForm').innerHTML = formHtml; }
    async function loadSortHeaders(){ const headers = await apiGet('/config/sort-headers'); document.getElementById('sortHeadersList').innerHTML = `<table class="data-table"><thead><tr><th>Файл/Таблица</th><th>Заголовок</th><th>Отображаемое имя</th><th>Сохранить</th></tr></thead><tbody>${headers.map(h=>`<tr><td>${escapeHtml(h.filename)}</td><td>${escapeHtml(h.header)}</td><td><input type="text" id="sh_${h.filename}_${h.header}" value="${escapeHtml(h.name)}" class="form-control-sm"></td><td><button class="btn-icon save-sh" data-filename="${escapeHtml(h.filename)}" data-header="${escapeHtml(h.header)}"><i class="fas fa-save"></i></button></td></tr>`).join('')}</tbody></table>`; document.querySelectorAll('.save-sh').forEach(btn => btn.addEventListener('click', async (e)=>{ const fn=btn.dataset.filename; const hdr=btn.dataset.header; const newName=document.getElementById(`sh_${fn}_${hdr}`).value; await apiPost('/config/sort-headers', {filename: fn, header: hdr, name: newName}); loadSortHeaders(); })); }
    document.getElementById('saveAppSettingsBtn')?.addEventListener('click', async ()=>{ const newSets = {}; ['BASE_URL','TENANT_ID','USER_ID','REQUEST_TIMEOUT','ES_HOST'].forEach(k=> newSets[k] = document.getElementById(`app_${k}`).value); await apiPost('/config/app-settings', newSets); alert('Настройки сохранены'); });
    loadConfigItems(); loadAppSettings(); loadSortHeaders();
</script>
</body>
</html>
