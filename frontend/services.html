<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сервисы экспорта и импорта</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
    <aside class="sidebar"><div class="logo"><i class="fas fa-microchip"></i><span>API Integrator</span></div>
        <nav class="nav-menu">
            <a href="/index.html" class="nav-item"><i class="fas fa-terminal"></i> Команды</a>
            <a href="/commands.html" class="nav-item"><i class="fas fa-database"></i> Шаблоны</a>
            <a href="/settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Настройки</a>
            <a href="/services.html" class="nav-item active"><i class="fas fa-cloud-upload-alt"></i> Сервисы</a>
            <a href="/index_db.html" class="nav-item"><i class="fas fa-table"></i> Данные</a>
            <a href="/current_patient.html" class="nav-item"><i class="fas fa-user-md"></i> Текущий пациент</a>
            <a href="/help.html" class="nav-item"><i class="fas fa-question-circle"></i> Помощь</a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="top-bar"><h1><i class="fas fa-cloud-upload-alt"></i> Сервисные операции</h1><div class="status-badge" id="exportStatus">⚙️ Готов</div></header>
        <div class="content-grid">
            <div class="card"><div class="card-header"><i class="fas fa-database"></i> Экспорт из Elasticsearch</div><div class="card-body"><button id="runExportBtn" class="btn btn-primary"><i class="fas fa-play"></i> Запустить экспорт</button> <button id="exportStatusBtn" class="btn btn-secondary"><i class="fas fa-info-circle"></i> Статус</button> <pre id="exportStatusOutput" class="code-block mt-2" style="background:#f1f5f9;"></pre></div></div>
            <div class="card"><div class="card-header"><i class="fas fa-key"></i> Работа с таблицей keys</div><div class="card-body"><button id="exportToKeysBtn" class="btn btn-primary"><i class="fas fa-sync"></i> Экспорт в keys</button> <button id="createKeysBtn" class="btn btn-secondary"><i class="fas fa-plus"></i> Создать keys</button></div></div>
            <div class="card"><div class="card-header"><i class="fas fa-file-csv"></i> Импорт CSV и схем</div><div class="card-body"><button id="importCsvBtn" class="btn btn-primary"><i class="fas fa-upload"></i> Импорт CSV → elastic_index</button> <button id="importHeadersBtn" class="btn btn-primary"><i class="fas fa-heading"></i> Импорт заголовков</button> <button id="copyIndexToFinalBtn" class="btn btn-primary"><i class="fas fa-copy"></i> Копировать в index_final</button> <button id="importSettingsSchemaBtn" class="btn btn-primary"><i class="fas fa-cog"></i> Импорт схемы настроек</button></div></div>
        </div>
    </main>
</div>
<script src="/js/common.js"></script>
<script>
    document.getElementById('runExportBtn')?.addEventListener('click', async () => { await apiPost('/export', {export_index_final: true}); alert('Экспорт запущен в фоне'); });
    document.getElementById('exportStatusBtn')?.addEventListener('click', async () => { const st = await apiGet('/export/status'); document.getElementById('exportStatusOutput').innerText = JSON.stringify(st, null, 2); });
    document.getElementById('exportToKeysBtn')?.addEventListener('click', async () => { await apiPost('/export_to_keys'); alert('Синхронизация keys запущена'); });
    document.getElementById('createKeysBtn')?.addEventListener('click', async () => { await apiPost('/create_keys'); alert('Таблица keys создана'); });
    document.getElementById('importCsvBtn')?.addEventListener('click', async () => { await apiPost('/import-csv'); alert('CSV импортирован'); });
    document.getElementById('importHeadersBtn')?.addEventListener('click', async () => { await apiPost('/import-headers'); alert('Заголовки импортированы'); });
    document.getElementById('copyIndexToFinalBtn')?.addEventListener('click', async () => { await apiPost('/copy-index-to-final'); alert('Данные скопированы в index_final'); });
    document.getElementById('importSettingsSchemaBtn')?.addEventListener('click', async () => { await apiPost('/import-settings-schema'); alert('Схема настроек обновлена'); });
</script>
</body>
</html>
