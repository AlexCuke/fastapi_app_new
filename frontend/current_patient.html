<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Текущий пациент (назначение)</title><link rel="stylesheet" href="/css/style.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"></head>
<body>
<div class="app-container"><aside class="sidebar"><div class="logo"><i class="fas fa-microchip"></i><span>API Integrator</span></div><nav class="nav-menu"><a href="/index.html" class="nav-item"><i class="fas fa-terminal"></i> Команды</a><a href="/commands.html" class="nav-item"><i class="fas fa-database"></i> Шаблоны</a><a href="/settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Настройки</a><a href="/services.html" class="nav-item"><i class="fas fa-cloud-upload-alt"></i> Сервисы</a><a href="/index_db.html" class="nav-item"><i class="fas fa-table"></i> Данные</a><a href="/current_patient.html" class="nav-item active"><i class="fas fa-user-md"></i> Текущий пациент</a><a href="/help.html" class="nav-item"><i class="fas fa-question-circle"></i> Помощь</a></nav></aside>
<main class="main-content"><header class="top-bar"><h1><i class="fas fa-user-md"></i> Текущее назначение</h1><div class="status-badge">🔄 current_assignment</div></header><div class="card"><div class="card-header"><i class="fas fa-info-circle"></i> Данные по assignmentCompositionUid</div><div class="card-body"><div id="currentAssignmentTable"></div></div></div></main></div>
<script src="/js/common.js"></script>
<script>
    async function loadCurrentAssignment(){
        const configItems = await apiGet('/config/items');
        const uidItem = configItems.find(i => i.key === 'assignmentCompositionUid');
        const uid = uidItem ? uidItem.value : null;
        if(!uid) { document.getElementById('currentAssignmentTable').innerHTML = '<div class="error-message">Не найден assignmentCompositionUid в конфиге</div>'; return; }
        const indexData = await apiGet('/api/index_final');
        const allRows = indexData.data || [];
        const filtered = allRows.filter(row => row['procedureAssignment.assignmentCompositionUid'] === uid);
        if(!filtered.length) { document.getElementById('currentAssignmentTable').innerHTML = '<div>Нет записей для данного UID</div>'; return; }
        const cols = Object.keys(filtered[0]);
        const html = `<div style="overflow-x:auto"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${filtered.map(r=>`<tr>${cols.map(c=>`<td>${escapeHtml(String(r[c]||''))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
        document.getElementById('currentAssignmentTable').innerHTML = html;
    }
    loadCurrentAssignment();
</script>
</body>
</html>
